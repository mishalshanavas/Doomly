name: Android Beta

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-beta-publishing
  cancel-in-progress: false

jobs:
  build-release:
    name: Build signed APK and AAB
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      DOOMLY_UPLOAD_STORE_FILE: ${{ github.workspace }}/.signing/doomly-upload.jks
      DOOMLY_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      DOOMLY_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      DOOMLY_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Resolve release version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION_NAME: ${{ inputs.version_name }}
          INPUT_VERSION_CODE: ${{ inputs.version_code }}
        run: |
          set -euo pipefail
          version_code=$(( $(date +%s) - 1577836800 ))
          version_name="1.0.$version_code-beta"
          release_tag="v$version_name"

          echo "DOOMLY_VERSION_NAME=$version_name" >> "$GITHUB_ENV"
          version_code=$(( $(date +%s) - 1577836800 ))
          echo "DOOMLY_VERSION_CODE=$version_code" >> "$GITHUB_ENV"
          echo "RELEASE_BASENAME=Doomly-$version_name" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$release_tag" >> "$GITHUB_ENV"

      - name: Restore upload keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          for value in \
            "$ANDROID_KEYSTORE_BASE64" \
            "$DOOMLY_UPLOAD_STORE_PASSWORD" \
            "$DOOMLY_UPLOAD_KEY_ALIAS" \
            "$DOOMLY_UPLOAD_KEY_PASSWORD"; do
            if [[ -z "$value" ]]; then
              echo "Missing one or more Android signing secrets." >&2
              exit 1
            fi
          done
          mkdir -p "$(dirname "$DOOMLY_UPLOAD_STORE_FILE")"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$DOOMLY_UPLOAD_STORE_FILE"

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Test and build release
        run: ./gradlew --no-daemon testGithubDebugUnitTest assembleGithubDebug

      - name: Verify and stage artifacts
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/github/debug/app-github-debug.apk"
          aab="app/build/outputs/bundle/playRelease/app-play-release.aab"
          test -s "$apk"

          apksigner_path="$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$apksigner_path"
          "$apksigner_path" verify --verbose --print-certs "$apk"


          mkdir -p release-artifacts
          cp "$apk" "release-artifacts/$RELEASE_BASENAME.apk"


      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_BASENAME }}-android
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          make_latest: false
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: Doomly ${{ env.DOOMLY_VERSION_NAME }}
          body: "Build code: ${{ env.DOOMLY_VERSION_CODE }}"
          generate_release_notes: true
          files: release-artifacts/*
          fail_on_unmatched_files: true

      - name: Remove signing material
        if: always()
        shell: bash
        run: |
          rm -f "$DOOMLY_UPLOAD_STORE_FILE"
          rmdir "$(dirname "$DOOMLY_UPLOAD_STORE_FILE")" 2>/dev/null || true
