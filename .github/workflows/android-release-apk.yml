name: Android Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version name, for example 1.2.3"
        required: true
        type: string
      version_code:
        description: "Unique, increasing Play Store version code"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    name: Build signed APK and AAB
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      DOOMLY_UPLOAD_STORE_FILE: ${{ github.workspace }}/.signing/doomly-upload.jks
      DOOMLY_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      DOOMLY_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      DOOMLY_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Resolve release version
        shell: bash
        env:
          INPUT_VERSION_NAME: ${{ inputs.version_name }}
          INPUT_VERSION_CODE: ${{ inputs.version_code }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version_name="${GITHUB_REF_NAME#v}"
            if [[ ! "$version_name" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)([-+][0-9A-Za-z.-]+)?$ ]]; then
              echo "Release tags must use semantic versioning, for example v1.2.3" >&2
              exit 1
            fi
            major=$((10#${BASH_REMATCH[1]}))
            minor=$((10#${BASH_REMATCH[2]}))
            patch=$((10#${BASH_REMATCH[3]}))
            if (( minor > 999 || patch > 999 )); then
              echo "Tag minor and patch numbers must each be 999 or lower" >&2
              exit 1
            fi
            version_code=$((major * 1000000 + minor * 1000 + patch))
          else
            version_name="$INPUT_VERSION_NAME"
            version_code="$INPUT_VERSION_CODE"
          fi

          if [[ ! "$version_name" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "Version name must use semantic versioning, for example 1.2.3" >&2
            exit 1
          fi
          if [[ ! "$version_code" =~ ^[1-9][0-9]*$ ]] || (( version_code > 2100000000 )); then
            echo "Version code must be an integer from 1 through 2100000000" >&2
            exit 1
          fi

          echo "DOOMLY_VERSION_NAME=$version_name" >> "$GITHUB_ENV"
          echo "DOOMLY_VERSION_CODE=$version_code" >> "$GITHUB_ENV"
          echo "RELEASE_BASENAME=Doomly-$version_name" >> "$GITHUB_ENV"

      - name: Restore Firebase config
        shell: bash
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          if [[ -n "$GOOGLE_SERVICES_JSON" ]]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          fi

      - name: Restore upload keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          for value in \
            "$ANDROID_KEYSTORE_BASE64" \
            "$DOOMLY_UPLOAD_STORE_PASSWORD" \
            "$DOOMLY_UPLOAD_KEY_ALIAS" \
            "$DOOMLY_UPLOAD_KEY_PASSWORD"; do
            if [[ -z "$value" ]]; then
              echo "Missing one or more Android signing secrets." >&2
              exit 1
            fi
          done
          mkdir -p "$(dirname "$DOOMLY_UPLOAD_STORE_FILE")"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$DOOMLY_UPLOAD_STORE_FILE"

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Test and build release
        run: ./gradlew --no-daemon testDebugUnitTest lintRelease assembleRelease bundleRelease

      - name: Verify and stage artifacts
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/app-release.apk"
          aab="app/build/outputs/bundle/release/app-release.aab"
          test -s "$apk"
          test -s "$aab"
          apksigner_path="$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$apksigner_path"
          "$apksigner_path" verify --verbose --print-certs "$apk"
          jarsigner -verify -strict "$aab"
          mkdir -p release-artifacts
          cp "$apk" "release-artifacts/$RELEASE_BASENAME.apk"
          cp "$aab" "release-artifacts/$RELEASE_BASENAME.aab"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_BASENAME }}-android
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-artifacts/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release-artifacts/* \
              --verify-tag \
              --title "Doomly $DOOMLY_VERSION_NAME" \
              --generate-notes

      - name: Remove signing material
        if: always()
        shell: bash
        run: |
          rm -f "$DOOMLY_UPLOAD_STORE_FILE"
          rmdir "$(dirname "$DOOMLY_UPLOAD_STORE_FILE")" 2>/dev/null || true
