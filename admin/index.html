<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Doomly admin</title>
  <style>
    :root { color-scheme:light; --bg:#fff; --panel:#f7f7f5; --line:#383838; --text:#171717; --muted:#707070; --accent:#171717; --ink:#fff; --good:#087443; --bad:#9f3b36; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:var(--bg); color:var(--text); font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif; }
    main { width:min(680px,100%); margin:0 auto; padding:64px 24px; }
    h1 { margin:0; font-size:34px; font-weight:900; letter-spacing:-.045em; text-transform:uppercase; }
    h1 span { display:inline-block; vertical-align:middle; color:var(--text); background:#0acf70; padding:4px 8px; border:1px solid var(--line); border-radius:4px; font-size:11px; letter-spacing:.08em; margin-left:8px; }
    .sub { color:var(--muted); margin:8px 0 28px; }
    .card { background:var(--bg); border:1px solid var(--line); border-radius:7px; padding:24px; }
    label { display:block; color:var(--muted); font-size:11px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; margin:20px 0 7px; }
    input,textarea { width:100%; border:1px solid #b4b4ae; border-radius:5px; background:var(--bg); color:var(--text); padding:12px 13px; font:inherit; }
    textarea { min-height:120px; resize:vertical; }
    button { min-height:48px; border:1px solid var(--accent); border-radius:7px; background:var(--accent); color:var(--ink); padding:12px 16px; font:700 14px system-ui,sans-serif; cursor:pointer; }
    button.secondary { background:transparent; border:1px solid var(--line); color:var(--text); }
    button:disabled { opacity:.5; cursor:wait; }
    :focus-visible { outline:3px solid #087443; outline-offset:3px; }
    .row { display:flex; gap:10px; align-items:center; justify-content:space-between; }
    .account { color:var(--muted); font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .hidden { display:none; }
    .status { margin-top:15px; min-height:24px; color:var(--muted); }
    .status.good { color:var(--good); } .status.bad { color:var(--bad); }
    .notice { border:1px solid var(--line); border-radius:5px; background:#fff8e8; padding:13px; color:var(--muted); font-size:13px; margin-bottom:18px; }
    @media (max-width:380px) { main { padding:32px 16px; } .card { padding:16px; } }
  </style>
</head>
<body>
  <main>
    <h1>Doomly <span>admin</span></h1>
    <p class="sub">Send a focused update to one signed-in device.</p>
    <section id="login" class="card">
      <div class="notice">Admin access is restricted by the Supabase <code>ADMIN_EMAILS</code> allowlist.</div>
      <button id="loginButton">Continue with Google</button>
      <div id="loginStatus" class="status"></div>
    </section>
    <section id="panel" class="card hidden">
      <div class="row"><div id="account" class="account"></div><button id="logoutButton" class="secondary">Sign out</button></div>
      <label for="uid">Target user UUID</label>
      <input id="uid" autocomplete="off" placeholder="e.g. 7d…" />
      <label for="title">Title</label>
      <input id="title" maxlength="80" value="Doomly update" />
      <label for="body">Message</label>
      <textarea id="body" maxlength="500" placeholder="Write the notification…"></textarea>
      <div style="margin-top:16px"><button id="sendButton">Send notification</button></div>
      <div id="status" class="status"></div>
    </section>
  </main>
  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    const SUPABASE_URL = 'https://eiireynwlctlmltohwve.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVpaXJleW53bGN0bG1sdG9od3ZlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA5MTAyNzIsImV4cCI6MjA5NjQ4NjI3Mn0.uzmjGuHgDy_Vdyh48IYmOm-Ock4vbOcVuqNkK2HOb1Y';
    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const $ = id => document.getElementById(id);
    const setStatus = (node, text, good = false) => { node.textContent = text; node.className = `status ${good ? 'good' : 'bad'}`; };

    function render(session) {
      $('login').classList.toggle('hidden', !!session);
      $('panel').classList.toggle('hidden', !session);
      if (session) $('account').textContent = session.user.email || session.user.id;
    }
    $('loginButton').onclick = async () => {
      $('loginButton').disabled = true;
      const { error } = await supabase.auth.signInWithOAuth({ provider:'google', options:{ redirectTo: location.href } });
      if (error) { setStatus($('loginStatus'), error.message); $('loginButton').disabled = false; }
    };
    $('logoutButton').onclick = () => supabase.auth.signOut();
    $('sendButton').onclick = async () => {
      const uid = $('uid').value.trim(), title = $('title').value.trim(), body = $('body').value.trim();
      if (!uid || !title || !body) return setStatus($('status'), 'Fill in the user UUID, title, and message.');
      $('sendButton').disabled = true; setStatus($('status'), 'Sending…', true);
      const { data, error } = await supabase.functions.invoke('admin-notify', { body:{ uid, title, body } });
      $('sendButton').disabled = false;
      if (error) return setStatus($('status'), error.message);
      setStatus($('status'), `Sent to ${data?.sent ?? 0} device(s).`, true);
    };
    const { data } = await supabase.auth.getSession(); render(data.session);
    supabase.auth.onAuthStateChange((_event, session) => render(session));
  </script>
</body>
</html>
